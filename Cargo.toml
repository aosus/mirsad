[package]
name = "mirsad"
version = "0.1.0"
edition = "2021"
description = "Mirsad — autonomous AI spam moderation bot for Aosus Matrix rooms (OpenRouter Decisions API)"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "mirsad"
path = "src/main.rs"

[dependencies]
# Latest stable as of Oct 2026 (float on minor/patch via caret reqs).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
config = { version = "0.15", default-features = false, features = ["toml"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
matrix-sdk = { version = "0.19", default-features = false, features = ["sqlite", "e2e-encryption", "rustls-aws-lc-rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
