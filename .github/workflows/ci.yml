name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-action-cache@v2
        with:
          cache-directories: target
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-action-cache@v2
        with:
          cache-directories: target
      - name: Validate example configs parse
        run: |
          mkdir -p /tmp/mirsad-ci-check/config
          cp config/config.example.toml /tmp/mirsad-ci-check/config.toml
          cp config/decision-questions.example.json /tmp/mirsad-ci-check/questions.json
          # Point the copied config at the copied questions file
          sed -i 's#questions_file = .*#questions_file = "/tmp/mirsad-ci-check/questions.json"#' /tmp/mirsad-ci-check/config.toml
          echo "--- config used for check ---"
          grep -E "questions_file|spam_threshold" /tmp/mirsad-ci-check/config.toml
      - run: cargo test --all-targets --locked=false
      - name: check-config smoke test
        run: |
          mkdir -p /tmp/mirsad-smoke/config
          cp config/config.example.toml /tmp/mirsad-smoke/config.toml
          cp config/decision-questions.example.json /tmp/mirsad-smoke/questions.json
          sed -i 's#questions_file = .*#questions_file = "/tmp/mirsad-smoke/questions.json"#' /tmp/mirsad-smoke/config.toml
          cargo run --quiet -- --config /tmp/mirsad-smoke/config.toml --check-config

  build-release:
    name: release build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-action-cache@v2
        with:
          cache-directories: target
      - run: cargo build --release --locked=false

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t mirsad:ci .
